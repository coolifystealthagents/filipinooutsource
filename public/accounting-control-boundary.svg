<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Accounting support control boundary</title>
  <desc id="desc">A four-step map showing that a remote support team prepares work while a named finance owner reviews, approves, and releases money.</desc>
  <rect width="1200" height="720" rx="36" fill="#172554"/>
  <text x="72" y="104" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">Keep the handoff easy to inspect</text>
  <text x="72" y="150" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="23">The support lane prepares evidence. Your named owner keeps authority.</text>
  <line x1="168" y1="344" x2="1032" y2="344" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif">
    <circle cx="168" cy="344" r="82" fill="#fff7ed" stroke="#fb923c" stroke-width="7"/>
    <text x="168" y="336" text-anchor="middle" fill="#7c2d12" font-size="25" font-weight="700">1. Prepare</text>
    <text x="168" y="370" text-anchor="middle" fill="#7c2d12" font-size="18">Support team</text>
    <circle cx="456" cy="344" r="82" fill="#eff6ff" stroke="#60a5fa" stroke-width="7"/>
    <text x="456" y="336" text-anchor="middle" fill="#1e3a8a" font-size="25" font-weight="700">2. Review</text>
    <text x="456" y="370" text-anchor="middle" fill="#1e3a8a" font-size="18">Named owner</text>
    <circle cx="744" cy="344" r="82" fill="#eff6ff" stroke="#60a5fa" stroke-width="7"/>
    <text x="744" y="336" text-anchor="middle" fill="#1e3a8a" font-size="25" font-weight="700">3. Approve</text>
    <text x="744" y="370" text-anchor="middle" fill="#1e3a8a" font-size="18">Named owner</text>
    <circle cx="1032" cy="344" r="82" fill="#eff6ff" stroke="#60a5fa" stroke-width="7"/>
    <text x="1032" y="336" text-anchor="middle" fill="#1e3a8a" font-size="25" font-weight="700">4. Release</text>
    <text x="1032" y="370" text-anchor="middle" fill="#1e3a8a" font-size="18">Separate account</text>
    <rect x="72" y="500" width="1056" height="132" rx="24" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="108" y="550" fill="#ffffff" font-size="24" font-weight="700">Escalate when:</text>
    <text x="108" y="590" fill="#dbeafe" font-size="21">support is missing, vendor details change, an item is unusual, or the written rule does not fit.</text>
  </g>
</svg>
