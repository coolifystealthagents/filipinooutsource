<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Philippines staffing planning board</title>
  <desc id="desc">A calm planning board with task cards, review notes, and access controls for a Filipino staffing role.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="640" rx="42" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="92" fill="#ffd89b" opacity="0.55"/>
  <circle cx="160" cy="520" r="120" fill="#9ed7ff" opacity="0.35"/>
  <g filter="url(#shadow)">
    <rect x="160" y="110" width="880" height="430" rx="32" fill="#ffffff" stroke="#eadfcf" stroke-width="3"/>
    <rect x="205" y="155" width="245" height="145" rx="22" fill="#17324d"/>
    <rect x="478" y="155" width="245" height="145" rx="22" fill="#f6efe4" stroke="#eadfcf" stroke-width="2"/>
    <rect x="751" y="155" width="245" height="145" rx="22" fill="#f6efe4" stroke="#eadfcf" stroke-width="2"/>
    <rect x="205" y="330" width="245" height="145" rx="22" fill="#f6efe4" stroke="#eadfcf" stroke-width="2"/>
    <rect x="478" y="330" width="245" height="145" rx="22" fill="#f6efe4" stroke="#eadfcf" stroke-width="2"/>
    <rect x="751" y="330" width="245" height="145" rx="22" fill="#f6efe4" stroke="#eadfcf" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700">
    <text x="235" y="205" fill="#ffffff" font-size="32">Role scope</text>
    <text x="235" y="245" fill="#d7e8f7" font-size="20">one starting queue</text>
    <text x="508" y="205" fill="#17324d" font-size="30">Examples</text>
    <text x="508" y="245" fill="#617083" font-size="20">normal and exception</text>
    <text x="781" y="205" fill="#17324d" font-size="30">Access</text>
    <text x="781" y="245" fill="#617083" font-size="20">named accounts</text>
    <text x="235" y="380" fill="#17324d" font-size="30">Reviewer</text>
    <text x="235" y="420" fill="#617083" font-size="20">clear owner</text>
    <text x="508" y="380" fill="#17324d" font-size="30">Questions</text>
    <text x="508" y="420" fill="#617083" font-size="20">one channel</text>
    <text x="781" y="380" fill="#17324d" font-size="30">Launch</text>
    <text x="781" y="420" fill="#617083" font-size="20">small batch first</text>
  </g>
</svg>
